<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Akční modal</title>
<script src="./support.js"></script>
<style>
:root{
  color-scheme: light;
  /* značka – zatím neutrální šedá škála */
  --primary:#9b414b; --primary-d:#7f343d; --primary-10:#f8eeef; /* značka Daver – vínová; konverzní (--main) zůstává černá */
  --main:#27272a; --main-d:#09090b;
  --nav-bg:#9b414b; --nav-fg:#fff; --nav-hover:#7f343d;
  --footer-bg:#27272a;
  --text:rgba(24,24,27,.92); --text-weaker:rgba(24,24,27,.68); --text-muted:#71717a;
  --bg:#fff; --bg-soft:#f8f8f8; --line:#e4e4e7;
  --input-border:#d4d4d8; --input-bg-soft:#f4f4f5;
  --success:#15803d; --success-text:#15803d; --primary-text:#27272a; --info:#1f6fa8; --danger:#b91c1c;
  --flag-discount:#ffc107; --flag-discount-fg:#1e1e1e;
  --flag-akce:#c2410c; --flag-novinka:#0277bd; --flag-doporucujeme:#1f6fa8; --flag-vyprodej:#3867d6;
  --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --corner-shape:squircle; /* squircle rohy: karty a tlačítka */
  --btn-radius:6px; --card-radius:8px; /* fallback bez podpory corner-shape */
  --btn-h-sm:32px; --btn-h-md:44px; --btn-h-lg:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --gutter-xxs:12px; --gutter-xs:16px; --gutter-s:16px; --gutter-m:24px; --gutter-l:24px; --gutter-xl:32px; --gutter-xxl:32px;
  --gutter:var(--gutter-xxs);
  --content-max:1560px;
  --section-gap:var(--space-6); --card-pad:var(--space-4); --grid-gap:var(--space-3);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-h1:29px; --fs-h2:23px; --fs-h3:19px; --fs-h4:17px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:13px;
  --fs-price-md:21px; --fs-price-sm:16px; --lh-body:1.5;
  --header-h:0px;
}
@supports (corner-shape:squircle){:root{--btn-radius:16px;--card-radius:24px;--radius-xs:4px;--radius-sm:12px;--radius-md:16px;--radius-lg:24px}}
@media (min-width:420px){:root{--gutter:var(--gutter-xs)}}
@media (min-width:550px){:root{--gutter:var(--gutter-s)}}
@media (min-width:820px){:root{--gutter:var(--gutter-m);--section-gap:var(--space-7);--card-pad:var(--space-5);--grid-gap:var(--space-4);--fs-h1:34px;--fs-h2:26px;--fs-h3:21px}}
@media (min-width:1000px){:root{--gutter:var(--gutter-l)}}
@media (min-width:1150px){:root{--gutter:var(--gutter-xl);--section-gap:var(--space-8);--fs-h1:38px;--fs-h2:28px;--fs-h3:21px;--fs-h4:18px;--fs-body:16px;--fs-body-sm:14px;--fs-caption:13px;--fs-price-md:21px;--fs-price-sm:16px}}
@media (min-width:1440px){:root{--gutter:var(--gutter-xxl)}}

*,*::before,*::after{box-sizing:border-box}
@supports (corner-shape:squircle){.qty,.miniQty,.rowQty,.searchBox,.ddBtn,.coupon input,.field input,.field select,.field textarea,.pickTools input,.perPage select,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{corner-shape:squircle}}
@supports (corner-shape:squircle){*,*::before,*::after{corner-shape:squircle}}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}
.pm{width:560px;max-width:100%;background:#fff;border-radius:var(--radius-lg,8px);overflow:hidden;position:relative;font-family:var(--font,system-ui,sans-serif);color:var(--text,#18181b);font-size:var(--fs-body,15px);line-height:1.5}
.pmImg{height:220px;border:0;border-radius:0}
.pmBody{padding:24px;display:flex;flex-direction:column;gap:12px}
.pmTag{align-self:flex-start;background:var(--flag-akce,#c2410c);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:2px}
.pm h2{margin:0;font-size:24px}.pm p{margin:0;color:var(--text-weaker,rgba(24,24,27,.68))}
.pmHi{display:flex;gap:12px;align-items:center;border:1px solid var(--line,#e4e4e7);border-radius:var(--radius-md,6px);padding:12px;font-weight:600}
.pmNote{font-size:12px}
.pmAct{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pmAct a.lnk{color:var(--primary-d,#27272a)}
.pmClose{position:absolute;top:8px;right:8px;background:#fff!important}
.pm .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--btn-radius,6px);border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.pm .btn-main{background:var(--main,#27272a);color:#fff}.pm .btn-main:hover{background:var(--main-d,#09090b);color:#fff}
.pm .btn-out{background:#fff;border-color:var(--input-border,#d4d4d8);color:inherit}.pm .btn-out:hover{border-color:var(--primary-d,#27272a)}
.pm .iconBtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:var(--btn-radius,6px);cursor:pointer;color:inherit}.pm .iconBtn:hover{background:var(--primary-10,#f4f4f5)}
.pm .ic{width:20px;height:20px;flex:none}
.pm .ph{display:flex;align-items:center;justify-content:center;background:var(--bg-soft,#f8f8f8);border:1px dashed var(--input-border,#d4d4d8);color:var(--text-muted,#71717a);font-size:12px;text-align:center;padding:6px;border-radius:4px}
.pm .todo{background:#fff7d6;color:#5c4a00;padding:0 4px;border-radius:2px}
@supports (corner-shape:squircle){.pm .btn,.pm .iconBtn{corner-shape:var(--corner-shape,squircle)}}
.pm :focus-visible{outline:2px solid var(--primary-d,#27272a);outline-offset:2px}</style>
</helmet>
<div class="pm" role="dialog" aria-modal="true" aria-labelledby="pmT">
<button class="iconBtn pmClose" type="button" aria-label="Zavřít" onClick="{{ close }}"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button>
<sc-if value="{{ image }}" hint-placeholder-val="{{ true }}"><div class="ph pmImg">[FOTO: akční vizuál]</div></sc-if>
<div class="pmBody">
<span class="pmTag">Akce</span>
<h2 id="pmT">Sleva 10 % na vybrané produkty Jovi</h2>
<p>Plastelíny, fixy, voskovky a modelovací hmoty Jovi se slevou 10 % do 31. 12. 2026.</p>
<div class="pmHi"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M243.31,136,144,36.69A15.86,15.86,0,0,0,132.69,32H40a8,8,0,0,0-8,8v92.69A15.86,15.86,0,0,0,36.69,144L136,243.31a16,16,0,0,0,22.63,0l84.68-84.68a16,16,0,0,0,0-22.63Zm-96,96L48,132.69V48h84.69L232,147.31ZM96,84A12,12,0,1,1,84,72,12,12,0,0,1,96,84Z"></path></svg><span>Akční produkty najdete v kategorii Akce</span></div>
<p class="pmNote">Sleva platí pro přihlášené B2B zákazníky a nelze ji kombinovat s jinými akcemi.</p>
<div class="pmAct"><a class="btn btn-main" href="Kategorie.dc.html">Nakupovat</a><a class="lnk" href="Doprava.dc.html">Podmínky dopravy</a></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 560, "height": 620}, "image": {"editor": "boolean", "default": true}, "onClose": {"editor": null}}'>

class Component extends DCLogic {
 renderVals(){return {image:this.props.image??true, close:()=>{if(this.props.onClose)this.props.onClose();}};}
}
</script>
</body>
</html>
