<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Drobečková navigace</title>
<script src="./support.js"></script>
<style>
:root{
  color-scheme: light;
  /* značka – zatím neutrální šedá škála */
  --primary:#9b414b; --primary-d:#7f343d; --primary-10:#f8eeef; /* značka Daver – vínová; konverzní (--main) zůstává černá */
  --main:#27272a; --main-d:#09090b;
  --nav-bg:#9b414b; --nav-fg:#fff; --nav-hover:#7f343d;
  --footer-bg:#27272a;
  --text:rgba(24,24,27,.92); --text-weaker:rgba(24,24,27,.68); --text-muted:#71717a;
  --bg:#fff; --bg-soft:#f8f8f8; --line:#e4e4e7;
  --input-border:#d4d4d8; --input-bg-soft:#f4f4f5;
  --success:#15803d; --success-text:#15803d; --primary-text:#27272a; --info:#1f6fa8; --danger:#b91c1c;
  --flag-discount:#ffc107; --flag-discount-fg:#1e1e1e;
  --flag-akce:#c2410c; --flag-novinka:#0277bd; --flag-doporucujeme:#1f6fa8; --flag-vyprodej:#3867d6;
  --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --corner-shape:squircle; /* squircle rohy: karty a tlačítka */
  --btn-radius:6px; --card-radius:8px; /* fallback bez podpory corner-shape */
  --btn-h-sm:32px; --btn-h-md:44px; --btn-h-lg:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --gutter-xxs:12px; --gutter-xs:16px; --gutter-s:16px; --gutter-m:24px; --gutter-l:24px; --gutter-xl:32px; --gutter-xxl:32px;
  --gutter:var(--gutter-xxs);
  --content-max:1560px;
  --section-gap:var(--space-6); --card-pad:var(--space-4); --grid-gap:var(--space-3);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-h1:29px; --fs-h2:23px; --fs-h3:19px; --fs-h4:17px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:13px;
  --fs-price-md:21px; --fs-price-sm:16px; --lh-body:1.5;
  --header-h:0px;
}
@supports (corner-shape:squircle){:root{--btn-radius:16px;--card-radius:24px;--radius-xs:4px;--radius-sm:12px;--radius-md:16px;--radius-lg:24px}}
@media (min-width:420px){:root{--gutter:var(--gutter-xs)}}
@media (min-width:550px){:root{--gutter:var(--gutter-s)}}
@media (min-width:820px){:root{--gutter:var(--gutter-m);--section-gap:var(--space-7);--card-pad:var(--space-5);--grid-gap:var(--space-4);--fs-h1:34px;--fs-h2:26px;--fs-h3:21px}}
@media (min-width:1000px){:root{--gutter:var(--gutter-l)}}
@media (min-width:1150px){:root{--gutter:var(--gutter-xl);--section-gap:var(--space-8);--fs-h1:42px;--fs-h2:30px;--fs-h3:23px;--fs-h4:19px;--fs-body:17px;--fs-body-sm:15px;--fs-caption:13px;--fs-price-md:23px;--fs-price-sm:17px}}
@media (min-width:1440px){:root{--gutter:var(--gutter-xxl)}}

*,*::before,*::after{box-sizing:border-box}
@supports (corner-shape:squircle){.qty,.miniQty,.rowQty,.searchBox,.ddBtn,.coupon input,.field input,.field select,.field textarea,.pickTools input,.perPage select,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{corner-shape:squircle}}
@supports (corner-shape:squircle){*,*::before,*::after{corner-shape:squircle}}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}
.bc{font-family:var(--font,system-ui,sans-serif);color:var(--text,#18181b);font-size:var(--fs-body,15px);line-height:1.5;font-size:var(--fs-body-sm,13px)}
.bc ol{list-style:none;margin:0;padding:12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.bc li{display:flex;align-items:center;gap:4px}
.bc a{color:var(--text-weaker,rgba(24,24,27,.68));text-decoration:none;display:inline-flex;align-items:center;min-height:32px}
.bc a:hover{color:var(--text,#18181b);text-decoration:underline}
.bc .ic{width:16px;height:16px}.bc .sep{width:12px;height:12px;color:var(--text-muted,#71717a)}
.bc [aria-current]{color:var(--text,#18181b);font-weight:500}
</style>
</helmet>
<nav class="bc BreadcrumbView" aria-label="Drobečková navigace"><ol>
<li><a href="Main.dc.html" aria-label="Úvod"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path></svg></a></li>
<sc-if value="{{ hasL1 }}" hint-placeholder-val="{{ true }}"><li><svg class="ic sep" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg><a href="{{ h1 }}">{{ l1 }}</a></li></sc-if>
<sc-if value="{{ hasL2 }}" hint-placeholder-val="{{ false }}"><li><svg class="ic sep" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg><a href="{{ h2 }}">{{ l2 }}</a></li></sc-if>
<li><svg class="ic sep" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg><span aria-current="page">{{ current }}</span></li>
</ol></nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 800, "height": 48}, "l1": {"editor": "text", "default": "Štětce a pomůcky"}, "h1": {"editor": null}, "l2": {"editor": null}, "h2": {"editor": null}, "current": {"editor": "text", "default": "Sady štětců"}}'>

class Component extends DCLogic {
 renderVals(){const p=this.props; const c=p.current||'Meyco sada plochých štětců syntetické č. 12 16 20';
  return {l1:p.l1||'',h1:p.h1||'Kategorie.dc.html',l2:p.l2||'',h2:p.h2||'Kategorie.dc.html',hasL1:!!p.l1,hasL2:!!p.l2,
   current:c.length>60?c.slice(0,59)+'…':c};}
}
</script>
</body>
</html>
