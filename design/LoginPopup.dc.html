<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Přihlášení</title>
<script src="./support.js"></script>
<style>
:root{
  color-scheme: light;
  /* značka – zatím neutrální šedá škála */
  --primary:#9b414b; --primary-d:#7f343d; --primary-10:#f8eeef; /* značka Daver – vínová; konverzní (--main) zůstává černá */
  --main:#27272a; --main-d:#09090b;
  --nav-bg:#9b414b; --nav-fg:#fff; --nav-hover:#7f343d;
  --footer-bg:#27272a;
  --text:rgba(24,24,27,.92); --text-weaker:rgba(24,24,27,.68); --text-muted:#71717a;
  --bg:#fff; --bg-soft:#f8f8f8; --line:#e4e4e7;
  --input-border:#d4d4d8; --input-bg-soft:#f4f4f5;
  --success:#15803d; --success-text:#15803d; --primary-text:#27272a; --info:#1f6fa8; --danger:#b91c1c;
  --flag-discount:#ffc107; --flag-discount-fg:#1e1e1e;
  --flag-akce:#c2410c; --flag-novinka:#0277bd; --flag-doporucujeme:#1f6fa8; --flag-vyprodej:#3867d6;
  --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --corner-shape:squircle; /* squircle rohy: karty a tlačítka */
  --btn-radius:6px; --card-radius:8px; /* fallback bez podpory corner-shape */
  --btn-h-sm:32px; --btn-h-md:44px; --btn-h-lg:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --gutter-xxs:12px; --gutter-xs:16px; --gutter-s:16px; --gutter-m:24px; --gutter-l:24px; --gutter-xl:32px; --gutter-xxl:32px;
  --gutter:var(--gutter-xxs);
  --content-max:1560px;
  --section-gap:var(--space-6); --card-pad:var(--space-4); --grid-gap:var(--space-3);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-h1:29px; --fs-h2:23px; --fs-h3:19px; --fs-h4:17px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:13px;
  --fs-price-md:21px; --fs-price-sm:16px; --lh-body:1.5;
  --header-h:0px;
}
@supports (corner-shape:squircle){:root{--btn-radius:16px;--card-radius:24px;--radius-xs:4px;--radius-sm:12px;--radius-md:16px;--radius-lg:24px}}
@media (min-width:420px){:root{--gutter:var(--gutter-xs)}}
@media (min-width:550px){:root{--gutter:var(--gutter-s)}}
@media (min-width:820px){:root{--gutter:var(--gutter-m);--section-gap:var(--space-7);--card-pad:var(--space-5);--grid-gap:var(--space-4);--fs-h1:34px;--fs-h2:26px;--fs-h3:21px}}
@media (min-width:1000px){:root{--gutter:var(--gutter-l)}}
@media (min-width:1150px){:root{--gutter:var(--gutter-xl);--section-gap:var(--space-8);--fs-h1:42px;--fs-h2:30px;--fs-h3:23px;--fs-h4:19px;--fs-body:17px;--fs-body-sm:15px;--fs-caption:13px;--fs-price-md:23px;--fs-price-sm:17px}}
@media (min-width:1440px){:root{--gutter:var(--gutter-xxl)}}

*,*::before,*::after{box-sizing:border-box}
@supports (corner-shape:squircle){.qty,.miniQty,.rowQty,.searchBox,.ddBtn,.coupon input,.field input,.field select,.field textarea,.pickTools input,.perPage select,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{corner-shape:squircle}}
@supports (corner-shape:squircle){*,*::before,*::after{corner-shape:squircle}}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}
.lp{width:320px;max-width:100%;background:#fff;border:1px solid var(--line,#e4e4e7);border-radius:var(--radius-md,6px);padding:20px;font-family:var(--font,system-ui,sans-serif);color:var(--text,#18181b);font-size:var(--fs-body,15px);line-height:1.5}
.lp h2{margin:0 0 4px;font-size:18px}.lp .lead{margin:0 0 14px;font-size:13px;color:var(--text-weaker,rgba(24,24,27,.68))}
.lpHead{display:flex;justify-content:space-between;align-items:flex-start}
.lpField{margin-bottom:12px}
.lpField label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.lpIn{display:flex;align-items:center;gap:8px;border:1px solid var(--input-border,#d4d4d8);border-radius:var(--radius-sm,4px);height:44px;padding:0 4px 0 10px}
.lpIn:focus-within{border-color:var(--primary-d,#27272a)}
.lpIn.bad{border-color:var(--danger,#b91c1c)}
.lpIn input{flex:1;min-width:0;border:0;outline:0;font:inherit;height:100%}
.lpIn .ic{color:var(--text-muted,#71717a)}
.lpErr{font-size:12px;color:var(--danger,#b91c1c);margin-top:4px}
.lpRow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:14px}
.lpCheck{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:44px}
.lpCheck input{width:18px;height:18px;accent-color:var(--primary-d,#27272a)}
.lp .btn-main{width:100%}
.lpFoot{margin-top:12px;font-size:13px;text-align:center}
.lpOk{text-align:center;padding:12px 0}
.lpOk .big{width:48px;height:48px;color:var(--success,#15803d);margin:0 auto 8px}
.lp a{color:var(--primary-d,#27272a)}
.lp .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--btn-radius,6px);border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.lp .btn-main{background:var(--main,#27272a);color:#fff}.lp .btn-main:hover{background:var(--main-d,#09090b);color:#fff}
.lp .btn-out{background:#fff;border-color:var(--input-border,#d4d4d8);color:inherit}.lp .btn-out:hover{border-color:var(--primary-d,#27272a)}
.lp .iconBtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:var(--btn-radius,6px);cursor:pointer;color:inherit}.lp .iconBtn:hover{background:var(--primary-10,#f4f4f5)}
.lp .ic{width:20px;height:20px;flex:none}
.lp .ph{display:flex;align-items:center;justify-content:center;background:var(--bg-soft,#f8f8f8);border:1px dashed var(--input-border,#d4d4d8);color:var(--text-muted,#71717a);font-size:12px;text-align:center;padding:6px;border-radius:4px}
.lp .todo{background:#fff7d6;color:#5c4a00;padding:0 4px;border-radius:2px}
@supports (corner-shape:squircle){.lp .btn,.lp .iconBtn{corner-shape:var(--corner-shape,squircle)}}
.lp :focus-visible{outline:2px solid var(--primary-d,#27272a);outline-offset:2px}</style>
</helmet>
<div class="lp LoginForm" role="dialog" aria-label="Přihlášení" onKeyDown="{{ onKey }}">
<sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{ submit }}" novalidate="">
<div class="lpHead"><h2>Přihlášení</h2><button class="iconBtn" type="button" aria-label="Zavřít" onClick="{{ close }}"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button></div>
<p class="lead">Velkoobchodní ceny vidíte po přihlášení.</p>
<div class="lpField"><label for="lpE">E-mail</label><div class="{{ eCls }}"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48Zm-96,85.15L52.57,64H203.43ZM98.71,128,40,181.81V74.19Zm11.84,10.85,12,11.05a8,8,0,0,0,10.82,0l12-11.05,58,53.15H52.57ZM157.29,128,216,74.18V181.82Z"></path></svg><input id="lpE" type="email" autocomplete="email" autoFocus="{{ true }}" aria-invalid="{{ eBad }}" value="{{ email }}" onChange="{{ onEmail }}"></div>
<sc-if value="{{ eBad }}" hint-placeholder-val="{{ false }}"><div class="lpErr" role="alert">Zadejte e-mail ve tvaru jmeno@firma.cz.</div></sc-if></div>
<div class="lpField"><label for="lpP">Heslo</label><div class="{{ pCls }}"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,140,152Z"></path></svg><input id="lpP" type="{{ pwType }}" autocomplete="current-password" aria-invalid="{{ pBad }}" value="{{ pw }}" onChange="{{ onPw }}"><button class="iconBtn" type="button" aria-label="Zobrazit heslo" aria-pressed="{{ show }}" onClick="{{ toggleShow }}"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.47,133.47,0,0,1,25,128,133.33,133.33,0,0,1,48.07,97.25C70.33,75.19,97.22,64,128,64s57.67,11.19,79.93,33.25A133.46,133.46,0,0,1,231.05,128C223.84,141.46,192.43,192,128,192Zm0-112a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Z"></path></svg></button></div>
<sc-if value="{{ pBad }}" hint-placeholder-val="{{ false }}"><div class="lpErr" role="alert">Heslo musí mít alespoň 4 znaky.</div></sc-if></div>
<div class="lpRow"><label class="lpCheck"><input type="checkbox" checked="{{ remember }}" onChange="{{ toggleRem }}">Zůstat přihlášen</label><a href="#zapomenute">Zapomenuté heslo?</a></div>
<button class="btn btn-main" type="submit">Přihlásit se</button>
<p class="lpFoot">Nemáte účet? <a href="Udaje.dc.html">Žádost o B2B registraci</a></p>
</form>
</sc-if>
<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div class="lpOk"><svg class="ic big" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"></path></svg><h2>Jste přihlášen</h2><p class="lead">Ceny se zobrazují podle vašich obchodních podmínek.</p><button class="btn btn-main" type="button" onClick="{{ close }}">Pokračovat v nákupu</button></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 320, "height": 420}, "onClose": {"editor": null}, "onLogin": {"editor": null}}'>

class Component extends DCLogic {
 constructor(props){super(props);this.state={email:'',pw:'',show:false,remember:true,tried:false,done:false};}
 renderVals(){
  const s=this.state;
  const eBad=s.tried&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.email);
  const pBad=s.tried&&s.pw.length<4;
  const close=()=>{if(this.props.onClose)this.props.onClose();};
  return {
   email:s.email,pw:s.pw,show:s.show,remember:s.remember,eBad:eBad,pBad:pBad,
   eCls:'lpIn'+(eBad?' bad':''),pCls:'lpIn'+(pBad?' bad':''),pwType:s.show?'text':'password',
   done:s.done,notDone:!s.done,
   onEmail:(e)=>this.setState({email:e.target.value}),onPw:(e)=>this.setState({pw:e.target.value}),
   toggleShow:()=>this.setState({show:!s.show}),toggleRem:()=>this.setState({remember:!s.remember}),
   close:close, onKey:(e)=>{if(e.key==='Escape'){e.stopPropagation();close();}},
   submit:(e)=>{e.preventDefault();const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.email)&&s.pw.length>=4;
     this.setState({tried:true});if(ok){this.setState({done:true});if(this.props.onLogin)this.props.onLogin(s.email);}}
  };
 }
}
</script>
</body>
</html>
