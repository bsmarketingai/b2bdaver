<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Menu přihlášeného</title>
<script src="./support.js"></script>
<style>
:root{
  color-scheme: light;
  /* značka – zatím neutrální šedá škála */
  --primary:#9b414b; --primary-d:#7f343d; --primary-10:#f8eeef; /* značka Daver – vínová; konverzní (--main) zůstává černá */
  --main:#27272a; --main-d:#09090b;
  --nav-bg:#9b414b; --nav-fg:#fff; --nav-hover:#7f343d;
  --footer-bg:#27272a;
  --text:rgba(24,24,27,.92); --text-weaker:rgba(24,24,27,.68); --text-muted:#71717a;
  --bg:#fff; --bg-soft:#f8f8f8; --line:#e4e4e7;
  --input-border:#d4d4d8; --input-bg-soft:#f4f4f5;
  --success:#15803d; --success-text:#15803d; --primary-text:#27272a; --info:#1f6fa8; --danger:#b91c1c;
  --flag-discount:#ffc107; --flag-discount-fg:#1e1e1e;
  --flag-akce:#c2410c; --flag-novinka:#0277bd; --flag-doporucujeme:#1f6fa8; --flag-vyprodej:#3867d6;
  --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --corner-shape:squircle; /* squircle rohy: karty a tlačítka */
  --btn-radius:6px; --card-radius:8px; /* fallback bez podpory corner-shape */
  --btn-h-sm:32px; --btn-h-md:44px; --btn-h-lg:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --gutter-xxs:12px; --gutter-xs:16px; --gutter-s:16px; --gutter-m:24px; --gutter-l:24px; --gutter-xl:32px; --gutter-xxl:32px;
  --gutter:var(--gutter-xxs);
  --content-max:1560px;
  --section-gap:var(--space-6); --card-pad:var(--space-4); --grid-gap:var(--space-3);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-h1:29px; --fs-h2:23px; --fs-h3:19px; --fs-h4:17px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:13px;
  --fs-price-md:21px; --fs-price-sm:16px; --lh-body:1.5;
  --header-h:0px;
}
@supports (corner-shape:squircle){:root{--btn-radius:16px;--card-radius:24px;--radius-xs:4px;--radius-sm:12px;--radius-md:16px;--radius-lg:24px}}
@media (min-width:420px){:root{--gutter:var(--gutter-xs)}}
@media (min-width:550px){:root{--gutter:var(--gutter-s)}}
@media (min-width:820px){:root{--gutter:var(--gutter-m);--section-gap:var(--space-7);--card-pad:var(--space-5);--grid-gap:var(--space-4);--fs-h1:34px;--fs-h2:26px;--fs-h3:21px}}
@media (min-width:1000px){:root{--gutter:var(--gutter-l)}}
@media (min-width:1150px){:root{--gutter:var(--gutter-xl);--section-gap:var(--space-8);--fs-h1:38px;--fs-h2:28px;--fs-h3:21px;--fs-h4:18px;--fs-body:16px;--fs-body-sm:14px;--fs-caption:13px;--fs-price-md:21px;--fs-price-sm:16px}}
@media (min-width:1440px){:root{--gutter:var(--gutter-xxl)}}

*,*::before,*::after{box-sizing:border-box}
@supports (corner-shape:squircle){.qty,.miniQty,.rowQty,.searchBox,.ddBtn,.coupon input,.field input,.field select,.field textarea,.pickTools input,.perPage select,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{corner-shape:squircle}}
@supports (corner-shape:squircle){*,*::before,*::after{corner-shape:squircle}}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}
.um{width:320px;max-width:100%;background:#fff;border:1px solid var(--line,#e4e4e7);border-radius:var(--radius-md,6px);padding:16px;font-family:var(--font,system-ui,sans-serif);color:var(--text,#18181b);font-size:var(--fs-body,15px);line-height:1.5}
.umHead{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line,#e4e4e7)}
@media (max-width:819px){.um{width:100%;border:0;border-radius:var(--card-radius,8px) var(--card-radius,8px) 0 0;padding:28px 20px calc(20px + env(safe-area-inset-bottom));position:relative}.um::before{content:"";position:absolute;top:10px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line,#e4e4e7)}}
.umMono{width:44px;height:44px;border-radius:50%;background:var(--primary-d,#27272a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
@supports (corner-shape:squircle){.umMono{corner-shape:squircle}}
.umHead strong{display:block}.umHead small{font-size:13px;color:var(--text-weaker,rgba(24,24,27,.68))}
.grp{display:inline-block;background:var(--primary-10,#f4f4f5);color:var(--primary-d,#27272a);border-radius:999px;padding:0 8px;font-weight:600}
.umHead .iconBtn{margin-left:auto}
.um ul{list-style:none;margin:8px 0;padding:0}
.um li a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 8px;border-radius:var(--radius-sm,4px);color:var(--text,#18181b);text-decoration:none}
.um li a:hover{background:var(--primary-10,#f4f4f5)}
.um .chev{margin-left:auto;color:var(--text-muted,#71717a);width:16px;height:16px}
.umOut{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 8px;border:0;border-top:1px solid var(--line,#e4e4e7);background:none;color:var(--danger,#b91c1c);font:inherit;font-weight:600;cursor:pointer}
.um .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--btn-radius,6px);border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.um .btn-main{background:var(--main,#27272a);color:#fff}.um .btn-main:hover{background:var(--main-d,#09090b);color:#fff}
.um .btn-out{background:#fff;border-color:var(--input-border,#d4d4d8);color:inherit}.um .btn-out:hover{border-color:var(--primary-d,#27272a)}
.um .iconBtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:var(--btn-radius,6px);cursor:pointer;color:inherit}.um .iconBtn:hover{background:var(--primary-10,#f4f4f5)}
.um .ic{width:20px;height:20px;flex:none}
.um .ph{display:flex;align-items:center;justify-content:center;background:var(--bg-soft,#f8f8f8);border:1px dashed var(--input-border,#d4d4d8);color:var(--text-muted,#71717a);font-size:12px;text-align:center;padding:6px;border-radius:4px}
.um .todo{background:#fff7d6;color:#5c4a00;padding:0 4px;border-radius:2px}
@supports (corner-shape:squircle){.um .btn,.um .iconBtn{corner-shape:var(--corner-shape,squircle)}}
.um :focus-visible{outline:2px solid var(--primary-d,#27272a);outline-offset:2px}</style>
</helmet>

<div class="umHead"><span class="umMono">{{ ini }}</span><div><strong>{{ userName }}</strong><small>Cenová skupina: <span class="grp">{{ group }}</span></small></div><button class="iconBtn" type="button" aria-label="Zavřít" onClick="{{ close }}"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 320, "height": 420}, "userName": {"editor": "text", "default": "Jan Novák"}, "group": {"editor": "text", "default": "Velkoobchod"}, "onClose": {"editor": null}, "onLogout": {"editor": null}}'>

class Component extends DCLogic {
 renderVals(){
  const n=this.props.userName||'Jan Novák';
  const close=()=>{if(this.props.onClose)this.props.onClose();};
  return {userName:n, ini:n.split(' ').map((x)=>x[0]).join('').slice(0,2), group:this.props.group||'Velkoobchod',
   close:close, logout:()=>{if(this.props.onLogout)this.props.onLogout();},
   onKey:(e)=>{if(e.key==='Escape'){e.stopPropagation();close();}}};
 }
}
</script>
