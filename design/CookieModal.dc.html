<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Souhlas s cookies</title>
<script src="./support.js"></script>
<style>
:root{
  color-scheme: light;
  /* značka – zatím neutrální šedá škála */
  --primary:#9b414b; --primary-d:#7f343d; --primary-10:#f8eeef; /* značka Daver – vínová; konverzní (--main) zůstává černá */
  --main:#27272a; --main-d:#09090b;
  --nav-bg:#9b414b; --nav-fg:#fff; --nav-hover:#7f343d;
  --footer-bg:#27272a;
  --text:rgba(24,24,27,.92); --text-weaker:rgba(24,24,27,.68); --text-muted:#71717a;
  --bg:#fff; --bg-soft:#f8f8f8; --line:#e4e4e7;
  --input-border:#d4d4d8; --input-bg-soft:#f4f4f5;
  --success:#15803d; --success-text:#15803d; --primary-text:#27272a; --info:#1f6fa8; --danger:#b91c1c;
  --flag-discount:#ffc107; --flag-discount-fg:#1e1e1e;
  --flag-akce:#c2410c; --flag-novinka:#0277bd; --flag-doporucujeme:#1f6fa8; --flag-vyprodej:#3867d6;
  --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --corner-shape:squircle; /* squircle rohy: karty a tlačítka */
  --btn-radius:6px; --card-radius:8px; /* fallback bez podpory corner-shape */
  --btn-h-sm:32px; --btn-h-md:44px; --btn-h-lg:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --gutter-xxs:12px; --gutter-xs:16px; --gutter-s:16px; --gutter-m:24px; --gutter-l:24px; --gutter-xl:32px; --gutter-xxl:32px;
  --gutter:var(--gutter-xxs);
  --content-max:1560px;
  --section-gap:var(--space-6); --card-pad:var(--space-4); --grid-gap:var(--space-3);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-h1:29px; --fs-h2:23px; --fs-h3:19px; --fs-h4:17px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:13px;
  --fs-price-md:21px; --fs-price-sm:16px; --lh-body:1.5;
  --header-h:0px;
}
@supports (corner-shape:squircle){:root{--btn-radius:16px;--card-radius:24px;--radius-xs:4px;--radius-sm:12px;--radius-md:16px;--radius-lg:24px}}
@media (min-width:420px){:root{--gutter:var(--gutter-xs)}}
@media (min-width:550px){:root{--gutter:var(--gutter-s)}}
@media (min-width:820px){:root{--gutter:var(--gutter-m);--section-gap:var(--space-7);--card-pad:var(--space-5);--grid-gap:var(--space-4);--fs-h1:34px;--fs-h2:26px;--fs-h3:21px}}
@media (min-width:1000px){:root{--gutter:var(--gutter-l)}}
@media (min-width:1150px){:root{--gutter:var(--gutter-xl);--section-gap:var(--space-8);--fs-h1:38px;--fs-h2:28px;--fs-h3:21px;--fs-h4:18px;--fs-body:16px;--fs-body-sm:14px;--fs-caption:13px;--fs-price-md:21px;--fs-price-sm:16px}}
@media (min-width:1440px){:root{--gutter:var(--gutter-xxl)}}

*,*::before,*::after{box-sizing:border-box}
@supports (corner-shape:squircle){.qty,.miniQty,.rowQty,.searchBox,.ddBtn,.coupon input,.field input,.field select,.field textarea,.pickTools input,.perPage select,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{corner-shape:squircle}}
@supports (corner-shape:squircle){*,*::before,*::after{corner-shape:squircle}}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}
.ck{width:640px;max-width:100%;background:#fff;border-radius:var(--radius-lg,8px);padding:24px;font-family:var(--font,system-ui,sans-serif);color:var(--text,#18181b);font-size:var(--fs-body,15px);line-height:1.5}
.ckHead{display:flex;gap:12px;align-items:center;margin-bottom:8px}.ckHead .ic{width:32px;height:32px}
.ck h2{margin:0;font-size:20px}.ck p{margin:0 0 16px;color:var(--text-weaker,rgba(24,24,27,.68))}
.ck a{color:var(--primary-d,#27272a)}
.ckSet{border:1px solid var(--line,#e4e4e7);border-radius:var(--radius-md,6px);margin-bottom:16px}
.ckRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line,#e4e4e7);min-height:52px}
.ckRow:last-child{border-bottom:0}.ckRow small{display:block;color:var(--text-weaker,rgba(24,24,27,.68));font-size:12px}
.ckRow input{width:40px;height:22px;accent-color:var(--primary-d,#27272a)}
.ckAct{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ckAct .first{margin-right:auto}
@media (max-width:600px){.ckAct{flex-direction:column}.ckAct .btn{width:100%}.ckAct .first{margin:0}}
.ck .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--btn-radius,6px);border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.ck .btn-main{background:var(--main,#27272a);color:#fff}.ck .btn-main:hover{background:var(--main-d,#09090b);color:#fff}
.ck .btn-out{background:#fff;border-color:var(--input-border,#d4d4d8);color:inherit}.ck .btn-out:hover{border-color:var(--primary-d,#27272a)}
.ck .iconBtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:var(--btn-radius,6px);cursor:pointer;color:inherit}.ck .iconBtn:hover{background:var(--primary-10,#f4f4f5)}
.ck .ic{width:20px;height:20px;flex:none}
.ck .ph{display:flex;align-items:center;justify-content:center;background:var(--bg-soft,#f8f8f8);border:1px dashed var(--input-border,#d4d4d8);color:var(--text-muted,#71717a);font-size:12px;text-align:center;padding:6px;border-radius:4px}
.ck .todo{background:#fff7d6;color:#5c4a00;padding:0 4px;border-radius:2px}
@supports (corner-shape:squircle){.ck .btn,.ck .iconBtn{corner-shape:var(--corner-shape,squircle)}}
.ck :focus-visible{outline:2px solid var(--primary-d,#27272a);outline-offset:2px}</style>
</helmet>
<div class="ck" role="dialog" aria-modal="true" aria-labelledby="ckT">
<div class="ckHead"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M164.49,163.51a12,12,0,1,1-17,0A12,12,0,0,1,164.49,163.51Zm-81-8a12,12,0,1,0,17,0A12,12,0,0,0,83.51,155.51Zm9-39a12,12,0,1,0-17,0A12,12,0,0,0,92.49,116.49Zm48-1a12,12,0,1,0,0,17A12,12,0,0,0,140.49,115.51ZM232,128A104,104,0,1,1,128,24a8,8,0,0,1,8,8,40,40,0,0,0,40,40,8,8,0,0,1,8,8,40,40,0,0,0,40,40A8,8,0,0,1,232,128Zm-16.31,7.39A56.13,56.13,0,0,1,168.5,87.5a56.13,56.13,0,0,1-47.89-47.19,88,88,0,1,0,95.08,95.08Z"></path></svg><h2 id="ckT">Na vašem soukromí nám záleží</h2></div>
<p>Cookies používáme k fungování e-shopu, měření návštěvnosti a marketingu. Podrobnosti najdete v <a href="Gdpr.dc.html">zásadách ochrany osobních údajů</a>.</p>
<sc-if value="{{ detail }}" hint-placeholder-val="{{ false }}">
<div class="ckSet">
<label class="ckRow"><span><strong>Nezbytné</strong><small>Vždy aktivní – košík, přihlášení</small></span><input type="checkbox" checked="{{ true }}" disabled="{{ true }}"></label>
<label class="ckRow"><span><strong>Analytické</strong><small>Měření návštěvnosti</small></span><input type="checkbox" checked="{{ an }}" onChange="{{ tAn }}"></label>
<label class="ckRow"><span><strong>Marketingové</strong><small>Personalizovaná reklama</small></span><input type="checkbox" checked="{{ mk }}" onChange="{{ tMk }}"></label>
</div>
</sc-if>
<div class="ckAct">
<button class="btn btn-out first" type="button" aria-expanded="{{ detail }}" onClick="{{ tDetail }}">Podrobné nastavení</button>
<sc-if value="{{ noDetail }}" hint-placeholder-val="{{ true }}"><button class="btn btn-out" type="button" onClick="{{ onlyNec }}">Pouze nezbytné</button></sc-if>
<sc-if value="{{ detail }}" hint-placeholder-val="{{ false }}"><button class="btn btn-out" type="button" onClick="{{ save }}">Uložit výběr</button></sc-if>
<button class="btn btn-main" type="button" onClick="{{ all }}">Povolit vše</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 640, "height": 330}, "onDone": {"editor": null}}'>

class Component extends DCLogic {
 constructor(p){super(p);this.state={detail:false,an:false,mk:false};}
 done(a,m){if(this.props.onDone)this.props.onDone({analytics:a,marketing:m});}
 renderVals(){const s=this.state;
  return {detail:s.detail,noDetail:!s.detail,an:s.an,mk:s.mk,
   tDetail:()=>this.setState({detail:!s.detail}),tAn:()=>this.setState({an:!s.an}),tMk:()=>this.setState({mk:!s.mk}),
   onlyNec:()=>this.done(false,false),save:()=>this.done(s.an,s.mk),all:()=>this.done(true,true)};}
}
</script>
</body>
</html>
