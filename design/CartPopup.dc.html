<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Mini košík</title>
<script src="./support.js"></script>
<style>
:root{
  color-scheme: light;
  /* značka – zatím neutrální šedá škála */
  --primary:#9b414b; --primary-d:#7f343d; --primary-10:#f8eeef; /* značka Daver – vínová; konverzní (--main) zůstává černá */
  --main:#27272a; --main-d:#09090b;
  --nav-bg:#9b414b; --nav-fg:#fff; --nav-hover:#7f343d;
  --footer-bg:#27272a;
  --text:rgba(24,24,27,.92); --text-weaker:rgba(24,24,27,.68); --text-muted:#71717a;
  --bg:#fff; --bg-soft:#f8f8f8; --line:#e4e4e7;
  --input-border:#d4d4d8; --input-bg-soft:#f4f4f5;
  --success:#15803d; --success-text:#15803d; --primary-text:#27272a; --info:#1f6fa8; --danger:#b91c1c;
  --flag-discount:#ffc107; --flag-discount-fg:#1e1e1e;
  --flag-akce:#c2410c; --flag-novinka:#0277bd; --flag-doporucujeme:#1f6fa8; --flag-vyprodej:#3867d6;
  --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --corner-shape:squircle; /* squircle rohy: karty a tlačítka */
  --btn-radius:6px; --card-radius:8px; /* fallback bez podpory corner-shape */
  --btn-h-sm:32px; --btn-h-md:44px; --btn-h-lg:56px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  --gutter-xxs:12px; --gutter-xs:16px; --gutter-s:16px; --gutter-m:24px; --gutter-l:24px; --gutter-xl:32px; --gutter-xxl:32px;
  --gutter:var(--gutter-xxs);
  --content-max:1560px;
  --section-gap:var(--space-6); --card-pad:var(--space-4); --grid-gap:var(--space-3);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-h1:29px; --fs-h2:23px; --fs-h3:19px; --fs-h4:17px; --fs-body:16px; --fs-body-sm:14px; --fs-caption:13px;
  --fs-price-md:21px; --fs-price-sm:16px; --lh-body:1.5;
  --header-h:0px;
}
@supports (corner-shape:squircle){:root{--btn-radius:16px;--card-radius:24px;--radius-xs:4px;--radius-sm:12px;--radius-md:16px;--radius-lg:24px}}
@media (min-width:420px){:root{--gutter:var(--gutter-xs)}}
@media (min-width:550px){:root{--gutter:var(--gutter-s)}}
@media (min-width:820px){:root{--gutter:var(--gutter-m);--section-gap:var(--space-7);--card-pad:var(--space-5);--grid-gap:var(--space-4);--fs-h1:34px;--fs-h2:26px;--fs-h3:21px}}
@media (min-width:1000px){:root{--gutter:var(--gutter-l)}}
@media (min-width:1150px){:root{--gutter:var(--gutter-xl);--section-gap:var(--space-8);--fs-h1:38px;--fs-h2:28px;--fs-h3:21px;--fs-h4:18px;--fs-body:16px;--fs-body-sm:14px;--fs-caption:13px;--fs-price-md:21px;--fs-price-sm:16px}}
@media (min-width:1440px){:root{--gutter:var(--gutter-xxl)}}

*,*::before,*::after{box-sizing:border-box}
@supports (corner-shape:squircle){.qty,.miniQty,.rowQty,.searchBox,.ddBtn,.coupon input,.field input,.field select,.field textarea,.pickTools input,.perPage select,input[type=text],input[type=search],input[type=email],input[type=tel],input[type=password],input[type=number],select,textarea{corner-shape:squircle}}
@supports (corner-shape:squircle){*,*::before,*::after{corner-shape:squircle}}
</style>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}
.cp{width:360px;max-width:100%;background:#fff;border:1px solid var(--line,#e4e4e7);border-radius:var(--radius-md,6px);padding:16px;font-family:var(--font,system-ui,sans-serif);color:var(--text,#18181b);font-size:var(--fs-body,15px);line-height:1.5}
.cpHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cpHead h2{margin:0;font-size:18px}.cpHead small{color:var(--text-weaker,rgba(24,24,27,.68));font-weight:400;font-size:13px;margin-left:6px}
.cpList{list-style:none;margin:0;padding:0;max-height:288px;overflow:auto}
.cpLine{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line,#e4e4e7)}
.cpLine .ph,.cpImg{width:52px;height:52px;padding:0;font-size:9px;object-fit:contain}
.cpName{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cpMeta{font-size:12px;color:var(--text-weaker,rgba(24,24,27,.68))}
.cpPrice{font-weight:700;font-size:14px;white-space:nowrap}
.cpTot{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 0}
.cpTot .pm{font-size:20px;font-weight:700;text-align:right}.cpTot .ps{font-size:12px;color:var(--text-weaker,rgba(24,24,27,.68));text-align:right}
.cpFree{border:1px solid var(--line,#e4e4e7);border-radius:var(--radius-md,6px);padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.cpFree .ic{width:22px;height:22px;flex:none}
.cpFreeIn{flex:1;display:flex;flex-direction:column;gap:6px}
.cpBar{appearance:none;-webkit-appearance:none;width:100%;height:6px;border:0;border-radius:3px;background:var(--line,#e4e4e7);overflow:hidden}
.cpBar::-webkit-progress-bar{background:var(--line,#e4e4e7);border-radius:3px}
.cpBar::-webkit-progress-value{background:var(--primary,#9b414b);border-radius:3px}
.cpBar::-moz-progress-bar{background:var(--primary,#9b414b);border-radius:3px}
.cpAct{display:flex;flex-direction:column;gap:8px}
.cpEmpty{text-align:center;padding:24px 8px;color:var(--text-weaker,rgba(24,24,27,.68))}
.cpEmpty .big{width:40px;height:40px;margin:0 auto 8px;color:var(--text-muted,#71717a)}
.cpEmpty strong{display:block;color:var(--text,#18181b)}
.cp .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--btn-radius,6px);border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.cp .btn-main{background:var(--main,#27272a);color:#fff}.cp .btn-main:hover{background:var(--main-d,#09090b);color:#fff}
.cp .btn-out{background:#fff;border-color:var(--input-border,#d4d4d8);color:inherit}.cp .btn-out:hover{border-color:var(--primary-d,#27272a)}
.cp .iconBtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;border-radius:var(--btn-radius,6px);cursor:pointer;color:inherit}.cp .iconBtn:hover{background:var(--primary-10,#f4f4f5)}
.cp .ic{width:20px;height:20px;flex:none}
.cp .ph{display:flex;align-items:center;justify-content:center;background:var(--bg-soft,#f8f8f8);border:1px dashed var(--input-border,#d4d4d8);color:var(--text-muted,#71717a);font-size:12px;text-align:center;padding:6px;border-radius:4px}
.cp .todo{background:#fff7d6;color:#5c4a00;padding:0 4px;border-radius:2px}
@supports (corner-shape:squircle){.cp .btn,.cp .iconBtn{corner-shape:var(--corner-shape,squircle)}}
.cp :focus-visible{outline:2px solid var(--primary-d,#27272a);outline-offset:2px}</style>
</helmet>
<div class="cp" role="dialog" aria-label="Nákupní košík" onKeyDown="{{ onKey }}">
<div class="cpHead"><h2>Nákupní košík<small>{{ countTxt }}</small></h2><button class="iconBtn" type="button" aria-label="Zavřít" onClick="{{ close }}"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path></svg></button></div>
<sc-if value="{{ has }}" hint-placeholder-val="{{ true }}">
<ul class="cpList"><sc-for list="{{ lines }}" as="l" hint-placeholder-count="2"><li class="cpLine"><sc-if value="{{ l.hasImg }}" hint-placeholder-val="{{ true }}"><img class="cpImg" src="{{ l.img }}" alt=""></sc-if><sc-if value="{{ l.noImg }}" hint-placeholder-val="{{ false }}"><div class="ph">[FOTO]</div></sc-if><div><div class="cpName">{{ l.name }}</div><div class="cpMeta">{{ l.meta }}</div></div><div class="cpPrice">{{ l.sum }}</div></li></sc-for></ul>
<div class="cpTot"><span>Celkem bez DPH</span><div><div class="pm">{{ total }}</div><div class="ps">{{ totalVat }} s DPH</div></div></div>
<div class="cpFree"><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M255.42,117l-14-35A15.93,15.93,0,0,0,226.58,72H192V64a8,8,0,0,0-8-8H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H49a32,32,0,0,0,62,0h50a32,32,0,0,0,62,0h17a16,16,0,0,0,16-16V120A7.94,7.94,0,0,0,255.42,117ZM192,88h34.58l9.6,24H192ZM32,72H176v64H32ZM80,208a16,16,0,1,1,16-16A16,16,0,0,1,80,208Zm81-24H111a32,32,0,0,0-62,0H32V152H176v12.31A32.11,32.11,0,0,0,161,184Zm31,24a16,16,0,1,1,16-16A16,16,0,0,1,192,208Zm48-24H223a32.06,32.06,0,0,0-31-24V128h48Z"></path></svg><div class="cpFreeIn"><span>{{ freeMsg }}</span><progress class="cpBar" max="1000" value="{{ freeVal }}" aria-label="Postup k dopravě zdarma od 1 000 Kč"></progress></div></div>
<div class="cpAct"><a class="btn btn-main" href="Kosik.dc.html">Přejít do košíku</a><button class="btn btn-out" type="button" onClick="{{ close }}">Pokračovat v nákupu</button></div>
</sc-if>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div class="cpEmpty"><svg class="ic big" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M230.14,58.87A8,8,0,0,0,224,56H62.68L56.6,22.57A8,8,0,0,0,48.73,16H24a8,8,0,0,0,0,16h18L67.56,172.29a24,24,0,0,0,5.33,11.27,28,28,0,1,0,44.4,8.44h45.42A27.75,27.75,0,0,0,160,204a28,28,0,1,0,28-28H91.17a8,8,0,0,1-7.87-6.57L80.13,152h116a24,24,0,0,0,23.61-19.71l12.16-66.86A8,8,0,0,0,230.14,58.87ZM104,204a12,12,0,1,1-12-12A12,12,0,0,1,104,204Zm96,0a12,12,0,1,1-12-12A12,12,0,0,1,200,204Zm4-74.57A8,8,0,0,1,196.1,136H77.22L65.59,72H214.41Z"></path></svg><strong>Košík je zatím prázdný</strong>Přidejte zboží tlačítkem Koupit u produktu.</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 360, "height": 440}, "lines": {"editor": null}, "onClose": {"editor": null}}'>
const CZK=(n)=>n.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kč';
const VAT=1.21;
const lsGet=(k)=>{try{return localStorage.getItem('daver'+k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem('daver'+k,v)}catch(e){}};

const DEMO=[{"name": "Meyco sada pěnových tupovacích štětců č. 15 25 35 mm", "qty": 4, "unit": "ks", "price": 36.4, "img": "/_blob/241d7a5e109cccbfbac2a9ff27a2141b"}, {"name": "Darwi čistič štětců 100 ml", "qty": 2, "unit": "ks", "price": 79.15, "img": "/_blob/724bc3619b88778cd7d54ea70542393f"}];
class Component extends DCLogic {
 renderVals(){
  const L=this.props.lines||DEMO;
  const t=L.reduce((a,l)=>a+l.price*l.qty,0); const c=L.reduce((a,l)=>a+l.qty,0);
  const close=()=>{if(this.props.onClose)this.props.onClose();};
  return {has:L.length>0,empty:L.length===0,countTxt:c+' ks',
   lines:L.map((l)=>({name:l.name,img:l.img||'',hasImg:!!l.img,noImg:!l.img,meta:l.qty+' '+l.unit+' × '+CZK(l.price),sum:CZK(l.price*l.qty)})),
   total:CZK(t),totalVat:CZK(t*VAT),close:close,
   freeVal:Math.min(1000,Math.round(t)),freeMsg:t>=1000?'Máte dopravu zdarma.':'Do dopravy zdarma zbývá '+CZK(1000-t)+' (zdarma od 1 000 Kč bez DPH)',onKey:(e)=>{if(e.key==='Escape'){e.stopPropagation();close();}}};
 }
}
</script>
</body>
</html>
